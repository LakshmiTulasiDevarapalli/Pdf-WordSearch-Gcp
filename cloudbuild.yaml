# Cloud Build configuration for PDF Word Search App

steps:
  # Step 0: Install dependencies
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Installing dependencies..."
        npm install -g pnpm@10.15.0
        pnpm install --frozen-lockfile
        echo "Done"

  # Step 1: Fetch secret and save to file
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud secrets versions access latest \
          --secret=pdf-supabase-anon-key \
          --project=${_AR_PROJECT_NUMBER} \
          --impersonate-service-account=${_AR_PROJECT_NUMBER}@cloudbuild.gserviceaccount.com \
          > /workspace/anon_key.txt
        echo "Secret fetched successfully"

  # Step 2: Build Docker image using saved secret
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        ANON_KEY=$(cat /workspace/anon_key.txt)
        docker build --no-cache \
          --build-arg NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL} \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY \
          -t ${_AR_HOSTNAME}/${_AR_PROJECT_NUMBER}/${_AR_REPOSITORY}/pdf-word-search-app:${COMMIT_SHA} \
          -t ${_AR_HOSTNAME}/${_AR_PROJECT_NUMBER}/${_AR_REPOSITORY}/pdf-word-search-app:latest \
          -f Dockerfile .

  # Step 3: Push commit SHA tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_NUMBER}/${_AR_REPOSITORY}/pdf-word-search-app:${COMMIT_SHA}'

  # Step 4: Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_NUMBER}/${_AR_REPOSITORY}/pdf-word-search-app:latest'

  # Step 5: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'pdf-word-search-app'
      - '--image'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_NUMBER}/${_AR_REPOSITORY}/pdf-word-search-app:${COMMIT_SHA}'
      - '--region'
      - '${_DEPLOY_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--set-env-vars'
      - 'NODE_ENV=production,NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}'
      - '--update-secrets'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=pdf-supabase-anon-key:latest,SUPABASE_SERVICE_ROLE_KEY=pdf-supabase-service-role-key:latest'

  # Step 6: Health Check
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Waiting for deployment..."
        sleep 20
        svc_url=$(gcloud run services describe pdf-word-search-app \
          --region=${_DEPLOY_REGION} \
          --format="value(status.url)")
        echo "App URL: $svc_url"
        if [ -z "$svc_url" ]; then
          echo "Failed to get service URL"
          exit 1
        fi
        curl -f --max-time 30 "$svc_url" || (echo "Health check failed" && exit 1)
        echo "Deployment successful! Live at: $svc_url"

images:
  - '${_AR_HOSTNAME}/${_AR_PROJECT_NUMBER}/${_AR_REPOSITORY}/pdf-word-search-app:${COMMIT_SHA}'
  - '${_AR_HOSTNAME}/${_AR_PROJECT_NUMBER}/${_AR_REPOSITORY}/pdf-word-search-app:latest'

substitutions:
  _AR_HOSTNAME: 'us-east4-docker.pkg.dev'
  _AR_PROJECT_NUMBER: '160722596615'
  _AR_REPOSITORY: 'cloud-run-source-deploy'
  _DEPLOY_REGION: 'us-east4'
  _SUPABASE_URL: 'https://nqbrbsjlqwwelbqiwkab.supabase.co'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitutionOption: ALLOW_LOOSE

timeout: '1200s'